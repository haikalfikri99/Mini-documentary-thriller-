<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>Preview animasi — S05–S07 + S14</title>
<script src="vendor/gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:#000}
.stage{position:absolute;inset:0;visibility:hidden}
#tag{position:absolute;left:40px;top:120px;font:600 24px ui-monospace,monospace;letter-spacing:.12em;color:rgba(239,230,214,.75);z-index:20}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="8.6" data-width="1080" data-height="1920" data-fps="30">
  <div id="tag">PREVIEW · S05</div>
  <audio id="voA" src="audio/vo_molase.mp3" data-start="0" data-duration="5.8" data-media-start="12.65" data-track-index="8"></audio>
  <audio id="voB" src="audio/vo_molase.mp3" data-start="5.8" data-duration="2.8" data-media-start="35.55" data-track-index="9" data-fade-out="0.2"></audio>
</div>
<script type="module">
// The same shot code as the storyboard (shots.js). Each shot gets its own Stage; the timeline maps preview time → VO time.
import { Stage } from '../../engine/core.js';
import { SHOTS } from './shots.js';
const root = document.getElementById('root');
const SEG = [ // [previewStart, voStart, voEnd, shotId]
  [0, 12.65, 13.9, 'S05'], [1.25, 13.9, 14.95, 'S06'], [2.3, 14.95, 18.45, 'S07'], [5.8, 35.55, 38.35, 'S14'] ];
let cur = null, active = -1;
function mount(i) { // one live WebGL stage at a time (software GL has a low context limit)
  if (cur) { cur.st.rBg.dispose(); cur.st.rFg.dispose(); cur.st.rBg.forceContextLoss(); cur.st.rFg.forceContextLoss(); cur.div.remove(); }
  const div = document.createElement('div'); div.className = 'stage'; div.style.visibility = 'visible'; root.insertBefore(div, root.firstChild);
  const st = new Stage(div, { w: 1080, h: 1920 }); const update = SHOTS.find(s => s.id === SEG[i][3]).build(st);
  cur = { div, st, update }; active = i; document.getElementById('tag').textContent = 'PREVIEW · ' + SEG[i][3];
}
function draw(T) {
  let i = SEG.length - 1; while (i > 0 && T < SEG[i][0]) i--;
  const [p0, v0, v1] = SEG[i], t = Math.min(v1 - 1e-3, v0 + (T - p0));
  if (i !== active) mount(i);
  cur.update(t); cur.st.render(t);
}
const tl = gsap.timeline({ paused: true, onUpdate: () => draw(tl.time()) });
tl.to({}, { duration: 8.6 }, 0);
window.__timelines = window.__timelines || {}; window.__timelines['main'] = tl;
tl.seek(0); draw(0);
</script>
</body>
</html>
