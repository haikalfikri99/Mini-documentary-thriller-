<!doctype html>
<html><head><meta charset="utf-8"><title>Molase — storyboard still</title>
<style>html,body{margin:0;background:#000;overflow:hidden}</style></head>
<body><div id="root"></div>
<script type="module">
// Renders one keyframe of one shot. URL: board.html?shot=S07&t=16.6
import { Stage } from '../../engine/core.js';
import { SHOTS } from './shots.js';
const q = new URLSearchParams(location.search);
try {
  const sh = SHOTS.find(s => s.id === q.get('shot')) || SHOTS[0];
  const st = new Stage(document.getElementById('root'), { w: 1080, h: 1920, scale: +(q.get('scale') || 1), theme: q.get('theme') || 'noir' });
  const update = sh.build(st);
  const t = q.has('t') ? +q.get('t') : sh.key;
  update(t); st.render(t);
  window.DONE = 1;
} catch (e) { window.DONE = 'ERR ' + e.message + '\n' + e.stack; }
</script></body></html>
