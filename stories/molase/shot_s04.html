<!doctype html>
<html lang="id" data-resolution="portrait">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>Shot S04 — uji 2.5D</title>
<script src="vendor/gsap.min.js"></script>
<style>
@font-face{font-family:"Playfair Display";src:url(assets/fonts/playfair-display-latin-700-italic.woff2) format("woff2");font-weight:700;font-style:italic}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:#000}
canvas{position:absolute;left:0;top:0;width:1080px;height:1920px}
#grade{position:absolute;inset:0;pointer-events:none;background:
  radial-gradient(ellipse 85% 70% at 50% 45%,transparent 55%,rgba(0,0,0,.6) 100%),
  linear-gradient(180deg,rgba(20,30,40,.18),transparent 35%,transparent 70%,rgba(0,0,0,.35))}
#grain{position:absolute;inset:-40px;background:url(assets/grain.png);opacity:.06;pointer-events:none}
#tag{position:absolute;left:64px;top:150px;font:600 26px "JetBrains Mono",monospace;letter-spacing:.16em;color:rgba(239,230,214,.8);text-transform:uppercase;display:flex;gap:12px;align-items:center}
#tag i{width:11px;height:11px;border-radius:50%;background:#c8321e;display:block}
#place{position:absolute;left:64px;top:1340px;opacity:0}
#place .t{font-family:"Playfair Display";font-style:italic;font-weight:700;font-size:84px;color:#efe6d6;text-shadow:0 4px 30px rgba(0,0,0,.75)}
#place .s{font:600 28px "JetBrains Mono",monospace;letter-spacing:.3em;color:#e9b77a;margin-top:14px;text-shadow:0 2px 12px rgba(0,0,0,.8)}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1080" data-height="1920" data-fps="30">
  <canvas id="gl" width="1080" height="1920"></canvas>
  <canvas id="fx" width="1080" height="1920"></canvas>
  <div id="grade"></div>
  <div id="place"><div class="t">Boston, 1919</div><div class="s">15 Januari · tengah hari</div></div>
  <div id="tag" class="clip" data-start="0" data-duration="6" data-track-index="2"><i></i>Rekonstruksi sinematik</div>
  <div id="grain" data-layout-allow-occlusion></div>
  <audio id="vo" src="audio/vo_molase.mp3" data-start="0.6" data-duration="3.7" data-media-start="8.95" data-track-index="9" data-fade-out="0.3"></audio>
</div>
<script>
(async function(){
  const load=src=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=src;});
  const [img,dep]=await Promise.all([load("assets/flow/ENV01_up.jpg"),load("assets/flow/ENV01_depth.png")]);
  const cv=document.getElementById("gl"), gl=cv.getContext("webgl",{preserveDrawingBuffer:true,antialias:false});
  const vs=`attribute vec2 p;varying vec2 uv;void main(){uv=p*.5+.5;uv.y=1.-uv.y;gl_Position=vec4(p,0,1);}`;
  // Parallax berbasis peta kedalaman: objek dekat bergeser/membesar lebih banyak dari objek jauh.
  const fs=`precision highp float;varying vec2 uv;uniform sampler2D img,dep;uniform float zoom,dolly;uniform vec2 shift,focus;uniform float aspect;
  void main(){
    vec2 p=uv;
    for(int i=0;i<6;i++){ float d=texture2D(dep,p).r;
      float s=zoom*(1.0+dolly*d);
      p=focus+(uv-focus)/s - shift*d; }
    vec2 q=focus+(p-focus); q.y=q.y*${(1920/1934).toFixed(5)};
    vec3 c=texture2D(img,clamp(q,0.001,0.999)).rgb;
    // grade sinematik ringan: bayangan sedikit dingin, kontras halus
    c=mix(c,c*vec3(.94,.98,1.04),.6); c=(c-.5)*1.07+.5;
    gl_FragColor=vec4(c,1);
  }`;
  const sh=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(o);return o;};
  const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);gl.useProgram(pr);
  const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(pr,"p");gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  const tex=(im,u)=>{const t=gl.createTexture();gl.activeTexture(gl.TEXTURE0+u);gl.bindTexture(gl.TEXTURE_2D,t);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,im);
    [gl.TEXTURE_WRAP_S,gl.TEXTURE_WRAP_T].forEach(k=>gl.texParameteri(gl.TEXTURE_2D,k,gl.CLAMP_TO_EDGE));
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);};
  tex(img,0);tex(dep,1);
  gl.uniform1i(gl.getUniformLocation(pr,"img"),0);gl.uniform1i(gl.getUniformLocation(pr,"dep"),1);
  const U=n=>gl.getUniformLocation(pr,n);
  const focus=[0.54,0.40];
  gl.uniform2f(U("focus"),...focus);
  const cam={zoom:1.04,dolly:0.0,sx:0.0,sy:0.0};
  const fx=document.getElementById("fx").getContext("2d");
  function rnd(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  const R=rnd(7), puffs=[...Array(60)].map((_,i)=>({t0:i*0.1,dx:R()*2-1,sz:.6+R()*.8,a:.5+R()*.5}));
  const motes=[...Array(90)].map(()=>({x:R(),y:R(),s:.6+R()*1.8,v:.2+R()*.6,d:R()}));
  // posisi layar dari titik sumber dengan kedalaman d (proyeksi maju dari shader)
  const toScreen=(u,v,d)=>{const s=cam.zoom*(1+cam.dolly*d); return [((u+cam.sx*d-focus[0])*s+focus[0])*1080,((v+cam.sy*d-focus[1])*s+focus[1])*1920];};
  let T=0;
  function draw(){
    gl.viewport(0,0,1080,1920);
    gl.uniform1f(U("zoom"),cam.zoom);gl.uniform1f(U("dolly"),cam.dolly);gl.uniform2f(U("shift"),cam.sx,cam.sy);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    fx.clearRect(0,0,1080,1920);
    // uap/asap kereta di ujung jalan, ikut bergerak dengan kedalamannya
    const [sx,sy]=toScreen(415/768,500/1376,0.08);
    puffs.forEach(p=>{const age=((T-p.t0)%6+6)%6; if(age>3.2) return; const k=age/3.2;
      const x=sx+p.dx*30*k+k*70, y=sy-k*260, r=(30+160*k)*p.sz; const g=fx.createRadialGradient(x,y,0,x,y,r);
      const al=.20*p.a*(1-k)*Math.min(1,age*3); g.addColorStop(0,`rgba(225,226,228,${al})`); g.addColorStop(1,"rgba(225,226,228,0)");
      fx.fillStyle=g; fx.beginPath(); fx.arc(x,y,r,0,7); fx.fill();});
    // kabut asap batu bara yang melayang lambat
    for(let i=0;i<3;i++){const x=((T*18*(i+1)+i*400)%1600)-260, y=820+i*120; const g=fx.createRadialGradient(x,y,0,x,y,520);
      g.addColorStop(0,"rgba(200,205,210,.10)"); g.addColorStop(1,"rgba(200,205,210,0)"); fx.fillStyle=g; fx.fillRect(x-520,y-520,1040,1040);}
    // partikel debu/uap dekat kamera
    motes.forEach(m=>{const [x,y]=toScreen(m.x,(m.y-T*.01*m.v+1)%1,0.6+m.d*.4); fx.fillStyle=`rgba(235,235,235,${.05+.1*m.d})`; fx.beginPath(); fx.arc(x,y,m.s*(1+m.d),0,7); fx.fill();});
  }
  const tl=gsap.timeline({paused:true,onUpdate:()=>{T=tl.time();draw();}});
  // gerak kamera: crane-down + dolly maju menyusuri jalan, sedikit tracking ke kanan
  tl.fromTo(cam,{zoom:1.04,dolly:0.0,sx:0.0,sy:-0.012},{zoom:1.10,dolly:0.22,sx:-0.018,sy:0.0,duration:6,ease:"sine.inOut"},0);
  tl.to("#place",{opacity:1,duration:.8},0.9);
  tl.to("#place",{opacity:0,duration:.5},5.0);
  tl.fromTo("#grain",{backgroundPosition:"0px 0px"},{backgroundPosition:"4428px 2772px",duration:6,ease:"steps(180)"},0);
  window.__timelines=window.__timelines||{}; window.__timelines["main"]=tl; tl.seek(0); draw();
})();
</script>
</body>
</html>
