<!doctype html>
<html lang="id" data-resolution="portrait">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>Banjir Ini Bukan Air — Prototipe v2</title>
<script src="vendor/gsap.min.js"></script>
<script src="paint.js"></script>
<style>
@font-face{font-family:"Playfair Display";src:url(assets/fonts/playfair-display-latin-700-italic.woff2) format("woff2");font-weight:700;font-style:italic}
@font-face{font-family:"Anton";src:url(assets/fonts/anton-latin-400-normal.woff2) format("woff2")}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#050505}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:#050505;color:#efe6d6;font-family:Inter,sans-serif}
.scene{position:absolute;inset:0;overflow:hidden;background:#050505}
.cam{position:absolute;inset:0;transform-origin:50% 55%}
.layer{position:absolute;left:0;top:0;width:1080px;height:1920px}
.grade{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 80% 65% at 50% 48%,transparent 50%,rgba(0,0,0,.72) 100%),linear-gradient(180deg,rgba(10,20,30,.25),transparent 30%,transparent 75%,rgba(0,0,0,.45))}
#grain{position:absolute;inset:-40px;background:url(assets/grain.png);opacity:.08;pointer-events:none}
#tag{position:absolute;left:64px;top:150px;font:600 28px "JetBrains Mono",monospace;letter-spacing:.16em;color:rgba(239,230,214,.8);text-transform:uppercase;display:flex;gap:14px;align-items:center}
#tag i{width:12px;height:12px;border-radius:50%;background:#c8321e;display:block}
.place{position:absolute;left:64px;top:1270px}
.place .t{font-family:"Playfair Display";font-style:italic;font-weight:700;font-size:92px;line-height:1;text-shadow:0 4px 30px rgba(0,0,0,.8)}
.place .s{font:600 30px "JetBrains Mono",monospace;letter-spacing:.3em;color:#e9a65a;margin-top:18px}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1080" data-height="1920" data-fps="30">

  <!-- 1 · ESTABLISHING BOSTON 1919 -->
  <div id="s1" class="scene clip" data-start="0" data-duration="3" data-track-index="0">
    <div class="cam" id="cam1">
      <canvas id="c1bg" class="layer" width="1080" height="1920"></canvas>
      <canvas id="c1mid" class="layer" width="1080" height="1920"></canvas>
      <canvas id="c1fg" class="layer" width="1080" height="1920"></canvas>
    </div>
    <div class="grade"></div>
    <div class="place" id="place1"><div class="t">Boston, 1919</div><div class="s">15 Januari</div></div>
  </div>

  <!-- 2 · TANGKI & PEKERJA -->
  <div id="s2" class="scene clip" data-start="3" data-duration="3" data-track-index="0">
    <div class="cam" id="cam2" style="transform-origin:50% 30%">
      <canvas id="c2bg" class="layer" width="1080" height="1920"></canvas>
      <canvas id="c2mid" class="layer" width="1080" height="1920"></canvas>
      <canvas id="c2fg" class="layer" width="1080" height="1920"></canvas>
    </div>
    <div class="grade"></div>
  </div>

  <!-- 3 · CLOSE-UP KEBOCORAN -->
  <div id="s3" class="scene clip" data-start="6" data-duration="3" data-track-index="0">
    <div class="cam" id="cam3">
      <canvas id="c3bg" class="layer" width="1080" height="1920"></canvas>
      <canvas id="c3fg" class="layer" width="1080" height="1920"></canvas>
    </div>
    <div class="grade"></div>
  </div>

  <!-- 4 · TANGKI PECAH, GELOMBANG MENERJANG -->
  <div id="s4" class="scene clip" data-start="9" data-duration="3" data-track-index="0">
    <div class="cam" id="cam4">
      <canvas id="c4bg" class="layer" width="1080" height="1920"></canvas>
      <canvas id="c4mid" class="layer" width="1080" height="1920"></canvas>
      <canvas id="c4wave" class="layer" width="1080" height="1920"></canvas>
      <canvas id="c4fg" class="layer" width="1080" height="1920"></canvas>
    </div>
    <div class="grade"></div>
  </div>

  <div id="tag" class="clip" data-start="0" data-duration="12" data-track-index="2"><i></i>Rekonstruksi sinematik</div>
  <div id="grain" data-layout-allow-occlusion></div>
</div>

<script>
(function(){
  const P=PAINT, $=s=>document.querySelector(s), ctx=id=>$(id).getContext("2d");

  /* ============ 1 · ESTABLISHING ============ */
  { const HZ=[118,98,88];
    const bg=ctx("#c1bg");
    P.sky(bg,1080,1920,{horizon:1160,top:[16,22,32],mid:[52,56,64],low:[176,118,72],sunX:560,sunY:1090,sunR:620,seed:3,cover:.44});
    // kota jauh di ujung jalan: siluet berkabut, menara jam, cerobong pabrik
    const r=P.rnd(9); let x=300;
    while(x<800){ const w=18+r()*40,h=20+r()*90; bg.fillStyle=P.rgba(P.mixc([60,52,52],[150,110,80],.55)); bg.fillRect(x,1160-h,w,h+4); x+=w; }
    bg.fillStyle="rgb(78,64,60)"; bg.fillRect(612,1000,26,162); bg.beginPath(); bg.moveTo(608,1002); bg.lineTo(625,960); bg.lineTo(642,1002); bg.fill();
    bg.fillStyle="rgba(255,210,150,.55)"; bg.beginPath(); bg.arc(625,1020,5,0,7); bg.fill();
    [[400,1080],[452,1060],[735,1070]].forEach(([cx,cy],i)=>{ bg.fillStyle="rgb(70,58,56)"; bg.fillRect(cx,cy,9,1162-cy); P.smoke(bg,cx+4,cy,260,40+i,{spread:110,alpha:.8,c:"50,44,44"}); });

    const mid=ctx("#c1mid");
    const people=[]; const pr=P.rnd(21);
    [[-760,1.05,"fedora",-1],[-640,1.6,"cap",1],[-700,2.3,"bowler",1],[-600,3.4,"fedora",-1],[-720,4.6,"cap",1],
     [ 690,1.25,"cap",-1],[ 760,1.9,"fedora",1],[ 620,2.8,"cap",-1],[ 700,3.9,"bowler",-1],[ 640,5.5,"fedora",1],
     [-120,2.6,"cap",1],[260,3.3,"fedora",-1]].forEach(([X,z,hat,d],i)=>people.push({z,draw:(PP)=>{const p=PP(X,0,z); P.person(mid,p[0],p[1],175*1.4/z,{hat,stride:(pr()-.5)*.12,woman:i%5===3,dir:d});}}));
    const C={vx:540,vy:1160,camH:520,f:1400,half:900,far:14,seed:5,haze:HZ,light:[560,1090],snow:.7,smoke:true,litRate:.35,
      extra:[...people,
        ...[0.9,1.7,2.6,3.8,5.2].flatMap(z=>[{z,draw:PP=>P.lamp(mid,PP,-760,z)},{z,draw:PP=>P.lamp(mid,PP,760,z)}]),
        {z:2.3,draw:PP=>{ P.elevated(mid,PP,2.3,{h0:520}); P.trainCar(mid,PP,-1900,1700,2.3,520); }},
        {z:1.8,draw:PP=>{const p=PP(-260,0,1.8); P.car(mid,p[0],p[1],120/1.8*1.4,false);}},
      ]};
    P.street(mid,C);
    // kabut senja di ujung jalan
    const fog=mid.createRadialGradient(560,1130,0,560,1130,700); fog.addColorStop(0,"rgba(230,160,100,.18)"); fog.addColorStop(1,"rgba(230,160,100,0)");
    mid.fillStyle=fog; mid.fillRect(0,0,1080,1920);

    const fg=ctx("#c1fg");
    P.person(fg,170,1930,620,{hat:"fedora",stride:.06,rimSide:1,rim:"rgba(245,175,100,.95)"});
    P.person(fg,960,1990,700,{hat:"cap",stride:-.04,rimSide:-1,woman:false});
    // partikel debu/uap di udara
    const dr=P.rnd(33); for(let i=0;i<160;i++){ const x=dr()*1080,y=500+dr()*1300,s=dr()*3+.6; fg.fillStyle=`rgba(255,215,160,${.08+dr()*.25})`; fg.beginPath(); fg.arc(x,y,s,0,7); fg.fill(); }
  }

  /* ============ 2 · TANGKI & PEKERJA ============ */
  { const HZ=[110,94,86], VY=1250, CAMH=170, F=1400;
    const bg=ctx("#c2bg");
    P.sky(bg,1080,1920,{horizon:VY,top:[18,22,30],mid:[58,58,62],low:[170,112,70],sunX:110,sunY:1080,sunR:700,seed:11,cover:.4});
    // pelabuhan & rel layang jauh di kiri
    bg.fillStyle="rgb(60,52,50)"; for(let i=0;i<6;i++){ bg.fillRect(i*36,1190,6,60); } bg.fillRect(0,1188,240,10);
    [[60,1090],[180,1120]].forEach(([x,y],i)=>{ bg.fillRect(x,y,10,VY-y); P.smoke(bg,x+5,y,300,70+i,{spread:120,c:"48,42,42"}); });
    const mid=ctx("#c2mid");
    // halaman: tanah becek, rel lori, genangan (per piksel, perspektif)
    const N=P.Noise(17); const top=VY+1;
    const g=P.pixels(1080,1920-top,(x,yy,o)=>{ const y=yy+top, z=(CAMH*F)/((y-VY)), X=((x-540)*z)/F;
      let c=P.mixc([42,36,32],[66,58,50],N.fbm(X/80,z/80,5));
      const cob=Math.abs(X+600)<500 && N(X/30|0,z/18|0)>.35; if(cob) c=P.mixc(c,[80,74,70],.35);
      for(const rx of [-1100,-960]){ if(Math.abs(X-rx)<9) c=[110,96,86]; }
      if(X<-900&&X>-1160&&((z/60)%1)<.25) c=P.mixc(c,[30,24,20],.7);
      const wet=P.sstep(.55,.63,N.fbm(X/300+7,z/500,4)); c=P.mixc(c,[150,110,80],wet*.55);
      const refl=Math.exp(-((x-110)**2)/(2*260**2))*wet; c=P.mixc(c,[250,180,110],refl*.8);
      const fog=P.clamp(1-Math.exp(-z/6000)); c=P.mixc(c,HZ,fog);
      o[0]=c[0];o[1]=c[1];o[2]=c[2]; });
    mid.drawImage(g,0,top);
    const T=P.tank(mid,{cx:640,Z0:3700,R:1370,Ht:1500,camH:CAMH,f:F,vy:VY,seed:23,light:{az:-1.05},haze:HZ,ladder:-.55,stains:1});
    // tong & pekerja kecil di kaki tangki
    const pp=(X,z)=>[540+X*F/z, VY+CAMH*F/z];
    [[-700,2500],[-560,2450],[-640,2350]].forEach(([X,z])=>{ const p=pp(X,z),s=90*F/z; mid.fillStyle="#1c1410"; mid.beginPath(); mid.roundRect(p[0]-s*.35,p[1]-s,s*.7,s,s*.08); mid.fill(); mid.fillStyle="rgba(240,170,95,.4)"; mid.fillRect(p[0]-s*.35,p[1]-s*.75,s*.1,s*.6); });
    [[-380,2300,"cap",.08],[-180,2200,"fedora",0],[260,2250,"cap",-.06],[420,2100,"cap",.1]].forEach(([X,z,hat,s])=>{ const p=pp(X,z); P.person(mid,p[0],p[1],175*F/z,{hat,stride:s}); });
    // haze hangat dari kiri
    const hz=mid.createLinearGradient(0,0,1080,0); hz.addColorStop(0,"rgba(230,150,90,.28)"); hz.addColorStop(.5,"rgba(230,150,90,0)"); mid.fillStyle=hz; mid.fillRect(0,0,1080,1920);
    const fg=ctx("#c2fg");
    P.person(fg,215,2010,820,{hat:"cap",rimSide:-1,rimW:.01});
    P.person(fg,560,1985,700,{hat:"fedora",rimSide:-1,rimW:.009,stride:.02});
    P.person(fg,930,2120,980,{hat:"cap",rimSide:-1,rimW:.01,arm:.4});
  }

  /* ============ 3 · CLOSE-UP KEBOCORAN ============ */
  { const N=P.Noise(41), N2=P.Noise(42), SEAM=930, ROW=[880,990], SP=150, RR=34;
    const bg=ctx("#c3bg");
    const lx=-.55, ly=-.6, lz=.58;
    const plate=P.pixels(1080,1920,(x,y,o)=>{
      let nx=0,ny=0,nz=1,shade=1;
      // lip pelat atas menumpang pelat bawah
      const upper=y<SEAM; if(!upper && y<SEAM+26) shade*=.35+.65*(y-SEAM)/26;
      if(upper && y>SEAM-10){ ny=.7; nz=.7; }
      // paku keling kubah
      for(const ry of ROW){ const cx=Math.round((x-(ry===ROW[0]?40:115))/SP)*SP+(ry===ROW[0]?40:115), dx=x-cx, dy=y-ry, d=Math.hypot(dx,dy);
        if(d<RR){ const hz=Math.sqrt(RR*RR-d*d)/RR; nx=dx/RR; ny=dy/RR; nz=hz; }
        else if(d<RR+10 && dx*lx+dy*ly>0){ shade*=.55+.45*(d-RR)/10; } }
      const n=Math.hypot(nx,ny,nz); nx/=n;ny/=n;nz/=n;
      const diff=P.clamp(nx*lx+ny*ly+nz*lz);
      const u=x/1080, v=y/1920;
      const rust=P.sstep(.45,.7,N.fbm(x/170,y/150,6)+.1*(upper?0:1));
      const pit=N2(x/2.5,y/2.5), flake=P.sstep(.7,.74,N2.fbm(x/40,y/40,4));
      let c=P.mixc([58,62,66],[86,88,90],N.fbm(x/30+20,y/30,3));
      c=P.mixc(c,P.mixc([84,40,20],[150,78,34],pit),rust);
      c=P.mixc(c,[120,112,104],flake*.4*(1-rust));
      // noda molase lama di bawah sambungan
      const stain=P.sstep(.58,.75,N.fbm(x/14,y/520,4))*P.sstep(SEAM+10,SEAM+120,y)*(1-P.sstep(1300,1900,y));
      c=P.mixc(c,[38,16,6],stain*.8);
      const spec=Math.pow(P.clamp(2*diff*nz-lz),30)*(1-rust)*.9;
      const L=(.22+.95*diff)*shade*(1-.5*Math.hypot(u-.35,v-.4));
      o[0]=c[0]*L+255*spec; o[1]=c[1]*L+215*spec; o[2]=c[2]*L+170*spec;
    });
    bg.drawImage(plate,0,0);
    // cahaya hangat menyapu dari kiri atas
    const lg=bg.createRadialGradient(260,620,0,260,620,1300); lg.addColorStop(0,"rgba(255,170,90,.22)"); lg.addColorStop(1,"rgba(255,170,90,0)"); bg.fillStyle=lg; bg.fillRect(0,0,1080,1920);

    const fg=ctx("#c3fg");
    // aliran molase dari celah sambungan (mengilap)
    const streams=[[300,SEAM+6,1420,46],[566,SEAM+8,1920,70],[612,SEAM+6,1180,30],[840,SEAM+8,1640,40]];
    streams.forEach(([x,y0,y1,w],i)=>{
      const r=P.rnd(80+i), path=new Path2D(); const pts=[]; for(let y=y0;y<=y1;y+=20){ pts.push([x+Math.sin(y/90+i)*8+(r()-.5)*3, y, w*(.7+.3*Math.sin(y/140+i))*(y<y0+60?.6+.4*(y-y0)/60:1)]); }
      path.moveTo(pts[0][0]-pts[0][2]*.5,pts[0][1]); pts.forEach(p=>path.lineTo(p[0]-p[2]/2,p[1]));
      const last=pts[pts.length-1]; path.quadraticCurveTo(last[0],last[1]+last[2]*.9,last[0]+last[2]/2,last[1]);
      for(let k=pts.length-1;k>=0;k--) path.lineTo(pts[k][0]+pts[k][2]/2,pts[k][1]); path.closePath();
      fg.save(); fg.shadowColor="rgba(0,0,0,.6)"; fg.shadowBlur=18; fg.shadowOffsetX=8; fg.shadowOffsetY=6; fg.fillStyle="#1a0903"; fg.fill(path); fg.restore();
      fg.save(); fg.clip(path);
      const g=fg.createLinearGradient(x-w/2,0,x+w/2,0); g.addColorStop(0,"#2a0f04"); g.addColorStop(.3,"#6a2e0c"); g.addColorStop(.55,"#3c1606"); g.addColorStop(1,"#120502"); fg.fillStyle=g; fg.fillRect(x-w,y0,w*2,y1-y0+w);
      fg.strokeStyle="rgba(255,214,160,.8)"; fg.lineWidth=Math.max(2,w*.09); fg.beginPath(); pts.forEach((p,k)=>k?fg.lineTo(p[0]-p[2]*.18,p[1]):fg.moveTo(p[0]-p[2]*.18,p[1])); fg.stroke();
      fg.strokeStyle="rgba(255,190,120,.25)"; fg.lineWidth=w*.25; fg.stroke();
      fg.restore();
    });
    // bibir celah: genangan di sepanjang sambungan
    const lip=new Path2D(); lip.moveTo(200,SEAM-2); for(let x=200;x<=960;x+=20) lip.lineTo(x,SEAM+8+Math.sin(x/37)*4); lip.lineTo(960,SEAM-4); lip.closePath();
    P.molassesFill(fg,lip,{x:200,y:SEAM-6,w:760,h:20},5,{streams:30,specs:20});
    // tetesan menggantung
    [[300,1420,22],[612,1180,16],[840,1640,18],[566,1920,0]].forEach(([x,y,r])=>{ if(!r) return; const id="d"+x; });
    // depth of field: blur tepi atas & bawah
    const dof=P.canvas(1080,1920), dc=dof.getContext("2d"); dc.filter="blur(10px)"; dc.drawImage($("#c3bg"),0,0); dc.drawImage($("#c3fg"),0,0); dc.filter="none";
    dc.globalCompositeOperation="destination-in"; const m=dc.createLinearGradient(0,0,0,1920); m.addColorStop(0,"rgba(0,0,0,1)"); m.addColorStop(.28,"rgba(0,0,0,0)"); m.addColorStop(.7,"rgba(0,0,0,0)"); m.addColorStop(1,"rgba(0,0,0,1)"); dc.fillStyle=m; dc.fillRect(0,0,1080,1920);
    fg.drawImage(dof,0,0);
  }
  // tetesan animasi (DOM, agar bisa jatuh)
  { const box=$("#cam3"); [[300,1420,24],[612,1180,18],[840,1640,20]].forEach(([x,y,r],i)=>{ const d=document.createElement("div"); d.className="drip"; d.style.cssText=`position:absolute;left:${x-r}px;top:${y}px;width:${r*2}px;height:${r*2.4}px;border-radius:50% 50% 50% 50%/40% 40% 60% 60%;background:radial-gradient(circle at 35% 30%,#ffd9a0 0,#b8661c 12%,#3a1606 45%,#120502 80%);box-shadow:6px 8px 14px rgba(0,0,0,.6)`; box.appendChild(d); }); }

  /* ============ 4 · TANGKI PECAH & GELOMBANG ============ */
  { const HZ=[120,92,74], VY=1050, CAMH=170, F=1400;
    const bg=ctx("#c4bg");
    P.sky(bg,1080,1920,{horizon:VY,top:[22,20,22],mid:[70,54,48],low:[190,110,60],sunX:600,sunY:900,sunR:760,seed:31,cover:.38});
    const mid=ctx("#c4mid");
    const C={vx:540,vy:VY,camH:CAMH,f:F,half:900,far:12,seed:77,haze:HZ,light:[600,900],snow:.4,smoke:false,litRate:.25,molasses:2400,near:.3,
      extra:[
        {z:9.5,draw:PP=>{ P.tank(mid,{cx:610,Z0:9500,R:1370,Ht:1500,camH:CAMH,f:F,vy:VY,seed:23,light:{az:-.3},haze:HZ,stains:1});
          // robekan: celah gelap + semburan molase dari dinding tangki
          const sp=new Path2D(); sp.moveTo(560,1060); sp.lineTo(585,930); sp.lineTo(610,1000); sp.lineTo(640,880); sp.lineTo(660,1060); sp.closePath();
          mid.fillStyle="#0b0402"; mid.fill(sp);
          const gush=new Path2D(); gush.moveTo(520,1070); gush.bezierCurveTo(470,980,700,930,720,1000); gush.bezierCurveTo(800,1030,900,1050,1000,1080); gush.lineTo(200,1090); gush.bezierCurveTo(300,1070,420,1080,520,1070);
          P.molassesFill(mid,gush,{x:200,y:930,w:800,h:160},9,{streams:60,specs:30,top:"#a5541a"}); }},
        {z:3.0,draw:PP=>{ P.elevated(mid,PP,3.0,{h0:500,tilt:.07}); P.trainCar(mid,PP,-600,1600,3.0,500,{rot:.32,dx:60,dy:40}); }},
      ]};
    P.street(mid,C);
    const dust=mid.createRadialGradient(610,980,0,610,980,640); dust.addColorStop(0,"rgba(150,95,60,.55)"); dust.addColorStop(1,"rgba(150,95,60,0)"); mid.fillStyle=dust; mid.fillRect(0,0,1080,1920);

    // gelombang molase setinggi gedung lantai dua, menerjang ke arah kamera
    const wv=ctx("#c4wave"), N=P.Noise(91);
    const crest=x=>760+Math.sin(x/170)*45+Math.sin(x/61+2)*18+(N(x/90,3)-.5)*60;
    const body=new Path2D(); body.moveTo(-80,1920); body.lineTo(-80,crest(-80));
    for(let x=-80;x<=1160;x+=10) body.lineTo(x,crest(x)); body.lineTo(1160,1920); body.closePath();
    P.molassesFill(wv,body,{x:-80,y:680,w:1240,h:1240},12,{streams:420,specs:160,dir:-1,top:"#b0601e"});
    // bibir puncak yang menggulung + cahaya tembus
    wv.save(); wv.clip(body);
    for(let x=-80;x<=1160;x+=6){ const y=crest(x); const g=wv.createLinearGradient(0,y,0,y+140); g.addColorStop(0,"rgba(255,205,130,.9)"); g.addColorStop(.12,"rgba(220,130,55,.6)"); g.addColorStop(1,"rgba(255,190,110,0)"); wv.fillStyle=g; wv.fillRect(x,y,7,140); }
    const shade=wv.createLinearGradient(0,800,0,1920); shade.addColorStop(0,"rgba(0,0,0,0)"); shade.addColorStop(1,"rgba(0,0,0,.55)"); wv.fillStyle=shade; wv.fillRect(-80,700,1240,1300);
    wv.restore();
    P.droplets(wv,90,{x:-40,y:600,w:1160,h:220},5,{min:2,max:7,ang:-.5});
    // papan dan puing terlempar
    const dr=P.rnd(55); for(let i=0;i<14;i++){ const x=dr()*1080,y=560+dr()*260,w=30+dr()*90; wv.save(); wv.translate(x,y); wv.rotate(dr()*3); wv.fillStyle="#1a120c"; wv.fillRect(-w/2,-5,w,10); wv.fillStyle="rgba(240,170,95,.4)"; wv.fillRect(-w/2,-5,w,2); wv.restore(); }

    // warga berlari menghindar (siluet, rim light dari belakang)
    const fg=ctx("#c4fg");
    [[160,1500,430,"cap",.1],[420,1430,330,"fedora",-.09],[700,1470,380,"bowler",.08],[900,1560,520,"cap",-.1],[300,1760,700,"fedora",.11]].forEach(([x,y,h,hat,s],i)=>{
      P.person(fg,x,y,h,{hat,stride:s,lean:.12*(i%2?1:-1)*.6,arm:.9*(i%2?-1:1),rimSide:i%2?1:-1,rimW:.01,rimTop:.005,rim:"rgba(255,180,100,.95)",woman:i===2});
    });
    P.droplets(fg,24,{x:0,y:1200,w:1080,h:600},8,{min:3,max:9,ang:.4});
  }

  /* ============ KAMERA ============ */
  gsap.set("#cam4",{rotate:-2.5,scale:1.06});
  const tl=gsap.timeline({paused:true});
  // 1: push-in pelan + parallax
  tl.fromTo("#cam1",{scale:1.0},{scale:1.07,duration:3,ease:"none"},0);
  tl.fromTo("#c1fg",{x:0},{x:-50,duration:3,ease:"none"},0);
  tl.fromTo("#c1bg",{y:0},{y:10,duration:3,ease:"none"},0);
  tl.fromTo("#place1",{opacity:0,y:20},{opacity:1,y:0,duration:.8,ease:"power2.out"},0.4);
  // 2: tilt-up mengungkap skala tangki
  tl.fromTo("#cam2",{y:-260,scale:1.12},{y:0,scale:1.0,duration:3,ease:"power2.inOut"},3);
  tl.fromTo("#c2fg",{y:120},{y:0,duration:3,ease:"power2.inOut"},3);
  // 3: macro drift + tetes jatuh
  tl.fromTo("#cam3",{scale:1.08,x:20},{scale:1.0,x:-10,duration:3,ease:"none"},6);
  document.querySelectorAll("#cam3 .drip").forEach((d,i)=>{ tl.fromTo(d,{scaleY:1,y:0},{scaleY:1.3,y:30,duration:1.2,ease:"power1.in"},6.2+i*.4); tl.to(d,{y:700,duration:.5,ease:"power2.in"},7.4+i*.4); });
  // 4: gelombang mendekat + guncangan
  tl.fromTo("#c4wave",{scale:.86,y:120,transformOrigin:"50% 100%"},{scale:1.08,y:-20,duration:3,ease:"power1.in"},9);
  tl.fromTo("#c4fg",{scale:1,y:0,transformOrigin:"50% 100%"},{scale:1.12,y:40,duration:3,ease:"none"},9);
  { const r=PAINT.rnd(3); for(let i=0;i<70;i++){ tl.to("#cam4",{x:(r()-.5)*14,y:(r()-.5)*14,duration:.04,ease:"none"},9+i*.04); } }
  tl.fromTo("#grain",{backgroundPosition:"0px 0px"},{backgroundPosition:"8856px 5544px",duration:12,ease:"steps(360)"},0);

  window.__timelines=window.__timelines||{}; window.__timelines["main"]=tl; tl.seek(0);
})();
