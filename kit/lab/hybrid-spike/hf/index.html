<!doctype html>
<html lang="id"><head><meta charset="UTF-8" /><meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<style>@font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald.woff2") format("woff2"); font-weight: 600; font-display: block; } * { margin: 0; padding: 0; box-sizing: border-box; } html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; } #world { position: absolute; inset: 0; width: 1080px; height: 1920px; }</style></head>
<body><div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1080" data-height="1920" data-fps="30">
<canvas id="world" class="clip" data-start="0" data-duration="8" data-track-index="0" width="1080" height="1920"></canvas>
</div>
<script>window.__timelines = window.__timelines || {}; window.__timelines["main"] = gsap.timeline({ paused: true });</script>
<script type="module">
import { createDiorama } from './diorama.js';
const cv = document.getElementById('world'), gl = document.createElement('canvas'); gl.width = 1080; gl.height = 1920;
await document.fonts.load('600 40px Oswald');
const D = createDiorama(gl, 1080, 1920);
window.addEventListener('hf-seek', e => D.frame(e.detail.time, cv));
D.frame(0, cv);
window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {}; window.__hf.buildReady.world = Promise.resolve();
</script></body></html>
