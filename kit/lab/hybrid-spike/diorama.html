<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}</style>
<style>@font-face{font-family:"Oswald";src:url("../../../stories/scroll/film/assets/fonts/Oswald.woff2") format("woff2");font-weight:600}</style></head>
<body><canvas id="gl" style="display:none"></canvas><canvas id="out"></canvas>
<script type="module">
import { createDiorama, KEYS } from './diorama.js';
const q = new URLSearchParams(location.search), W = +q.get('w') || 540, H = Math.round(W * 16 / 9);
const out = document.getElementById('out'); out.width = W; out.height = H; const gl = document.getElementById('gl'); gl.width = W; gl.height = H;
window.ready = document.fonts.load('600 40px Oswald').then(() => { window.D = createDiorama(gl, W, H); return KEYS[KEYS.length - 1].t; });
window.renderFrame = t => { const info = window.D.frame(t, out); return { url: out.toDataURL('image/png'), info }; };
</script></body></html>
