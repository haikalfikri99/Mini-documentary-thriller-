<!doctype html>
<html lang="id"><head><meta charset="UTF-8" /><meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<style>@font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald.woff2") format("woff2"); font-weight: 600; font-display: block; } @font-face { font-family: "Courier Prime"; src: url("assets/fonts/CourierPrime.woff2") format("woff2"); font-weight: 700; font-display: block; }
* { margin: 0; padding: 0; box-sizing: border-box; } html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; } #world { position: absolute; inset: 0; width: 1080px; height: 1920px; }</style></head>
<body><div id="root" data-composition-id="main" data-start="0" data-duration="__DUR__" data-width="1080" data-height="1920" data-fps="30">
<canvas id="world" class="clip" data-start="0" data-duration="__DUR__" data-track-index="0" width="1080" height="1920"></canvas>
<div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="__DUR__" data-track-index="3" data-track-kind="captions" data-width="1080" data-height="1920" style="z-index:4"></div>
<audio id="mix" class="clip" src="assets/mix.wav" data-start="0" data-track-index="1" data-volume="1"></audio>
</div>
<script>window.__timelines = window.__timelines || {}; window.__timelines["main"] = gsap.timeline({ paused: true });</script>
<script type="module">
import { init, renderAt } from './film.js';
const cv = document.getElementById('world'); init(cv.getContext('2d'));
window.addEventListener('hf-seek', e => renderAt(e.detail.time));
const ready = Promise.all([document.fonts.load('600 40px Oswald'), document.fonts.load('700 30px "Courier Prime"')]).then(() => renderAt(0));
window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {}; window.__hf.buildReady.world = ready;
renderAt(0);
</script></body></html>
