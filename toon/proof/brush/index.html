<!doctype html><html><head><meta charset="UTF-8"><title>brush test</title>
<style>html,body{margin:0;background:#000}#c{display:block}</style>
<script src="/node_modules/p5/lib/p5.min.js"></script><script src="/node_modules/p5.brush/dist/p5.brush.js"></script></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const out = document.getElementById('c').getContext('2d');
let P5, ready = false;
new p5(p => {
  brush.instance(p);
  p.setup = () => { const c = p.createCanvas(540, 960, p.WEBGL); c.elt.style.display = 'none'; p.pixelDensity(1); p.noLoop(); ready = true; };
  p.draw = () => {
    p.clear(); p.push(); p.translate(-270, -480); p.randomSeed(7);
    brush.scaleBrushes(1.4);
    // sky wash
    brush.noStroke(); brush.fill('#9fb3c4', 70); brush.fillBleed(.25); brush.fillTexture(.55, .35); brush.rect(0, 0, 540, 420);
    // brick facade with bleed + texture, ink outline
    brush.set('HB', '#2a2420', 1.2); brush.fill('#8a5a48', 110); brush.fillBleed(.15); brush.fillTexture(.7, .5);
    brush.polygon([[30, 200], [260, 330], [260, 900], [30, 900]]);
    // shadow hatching
    brush.noFill(); brush.set('2B', '#2a2a40', 1); brush.hatch(5, 0.9); brush.polygon([[150, 260], [260, 330], [260, 900], [150, 900]]); brush.noHatch();
    // molasses blob with heavy bleed
    brush.noStroke(); brush.fill('#a8571a', 140); brush.fillBleed(.4); brush.fillTexture(.5, .6); brush.circle(400, 640, 110);
    p.pop();
  };
  P5 = p;
});
window.render = t => { P5.redraw(); out.fillStyle = '#efe8d8'; out.fillRect(0, 0, 1080, 1920); out.drawImage(P5.canvas, 0, 0, 1080, 1920); };
const wait = () => ready ? (window.READY = true) : setTimeout(wait, 50); wait();
</script></body></html>
